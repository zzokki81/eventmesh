name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventmesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eventmesh_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventmesh_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1

      - name: Apply migrations
        run: migrate -path order/migrations -database "$DATABASE_URL" up

      - name: Build
        run: |
          go build -ldflags "
          -X github.com/zzokki81/eventmesh/order/app.Version=${{ github.ref_name }}
          -X github.com/zzokki81/eventmesh/order/app.CommitHash=${GITHUB_SHA::7}
          -X github.com/zzokki81/eventmesh/order/app.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          " -o bin/order ./cmd/order

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 60s ./...

      - name: Integration tests
        # Spins up a throwaway Postgres via testcontainers (the runner has a
        # Docker daemon), so these match the local `make test-integration` run.
        run: go test -race -tags integration -count=1 ./order/repository/postgres/...
        env:
          # The runner is ephemeral, so skip the Ryuk reaper container that
          # would otherwise clean up after the test containers.
          TESTCONTAINERS_RYUK_DISABLED: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
